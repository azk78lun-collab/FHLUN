name: Build Lun enhanced Sing-box

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified, versioned core bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pin.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version pinned by Lun
        id: pin
        run: |
          version=$(sed -n 's/^LUN_SINGBOX_VERSION=//p' lun.sh)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Build enhanced core
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          SING_BOX_VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir -p "$RUNNER_TEMP/lun-core"
          bash modules/multiuser/build-singbox-enhanced.sh "$RUNNER_TEMP/lun-core/sing-box" "$RUNNER_TEMP/lun-core/lun-sb-stats"
      - name: Verify Snell v6, legacy config and real statistics
        if: matrix.arch == 'amd64'
        run: |
          export LUN_TEST_SNELL="$RUNNER_TEMP/lun-core/sing-box"
          export LUN_TEST_SB_STATS="$RUNNER_TEMP/lun-core/lun-sb-stats"
          export PYTHONPATH="$PWD/tests/offline"
          python3 -B -m unittest discover -s tests -p 'test_snell_core.py' -v
      - name: Package matched binaries
        run: tar -C "$RUNNER_TEMP/lun-core" -czf "sing-box-lun-${{ matrix.arch }}.tar.gz" sing-box lun-sb-stats
      - uses: actions/upload-artifact@v4
        with:
          name: lun-singbox-${{ matrix.arch }}
          path: sing-box-lun-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lun-singbox-*
          merge-multiple: true
      - name: Publish fixed release (never overwrite an existing bundle)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          gh release create "lun-singbox-$VERSION" sing-box-lun-amd64.tar.gz sing-box-lun-arm64.tar.gz \
            --target "$GITHUB_SHA" --latest=false --title "Lun enhanced Sing-box $VERSION" \
            --notes "Versioned Sing-box with Snell v6 and the loopback V2Ray statistics helper."
